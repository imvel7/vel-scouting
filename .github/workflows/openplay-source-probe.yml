name: Openplay single-season source probe

on:
  pull_request:
    paths:
      - "vision/openplay_source/**"
      - ".github/workflows/openplay-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openplay-single-season-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Openplay client
        run: python -m pip install --disable-pip-version-check "openplay==0.1.0"
      - name: Probe one competition-season without publishing data
        env:
          OPENPLAY_CACHE_DIR: ${{ runner.temp }}/openplay-cache
        run: python vision/openplay_source/probe_single_season.py
