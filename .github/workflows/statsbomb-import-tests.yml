name: StatsBomb import prototype tests

on:
  push:
    branches: [main, feature/verified-minutes-calculation]
    paths:
      - "vision/statsbomb_open_data/**"
      - ".github/workflows/statsbomb-import-tests.yml"
  pull_request:
    paths:
      - "vision/statsbomb_open_data/**"
      - ".github/workflows/statsbomb-import-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  statsbomb-import-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile importer
        run: python -m py_compile vision/statsbomb_open_data/import_open_data.py
      - name: Run unit tests
        run: python -m unittest discover -s vision/statsbomb_open_data -p "test_*.py" -v

  statsbomb-live-data-smoke:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/feature/verified-minutes-calculation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Import three public matches without publishing the report
        run: |
          python vision/statsbomb_open_data/import_open_data.py \
            --competition-id 43 --season-id 106 \
            --match-id 3869519 --match-id 3869685 --match-id 3869151 \
            --data-root .cache/statsbomb-open-data/smoke/raw \
            --report .cache/statsbomb-open-data/smoke/import-report.json > /dev/null
          python -c "import json; p=json.load(open('.cache/statsbomb-open-data/smoke/import-report.json', encoding='utf-8')); assert p['sample']['selected_match_count'] == 3; assert p['sample']['event_count'] > 0; assert len(p['player_sample_totals']) > 0; assert all(m['quality']['minutes_calculation']['status'] == 'valid' for m in p['matches']), [m['quality']['minutes_calculation'] for m in p['matches']]; m=next(x for x in p['player_sample_totals'] if str(x['player_id']) == '5503'); assert m['matches_with_appearance_evidence'] == 3; assert m['minutes_calculation_complete'] is True and m['minutes_played'] is not None and m['minutes_played'] > 0; assert isinstance(m['per90_metrics'], dict) and m['per90_metrics']['events'] > 0 and m['per90_metrics']['passes_attempted'] > 0; cb=next(x for x in p['role_profiles']['CB']['players'] if str(x['player_id']) == '20572'); assert cb['matches_with_appearance_evidence'] == 3; assert any('Center Back' in role for role in cb['positions_seen']); assert cb['metrics']['events'] > 0; assert cb['metrics']['passes_attempted'] > 0; assert cb['minutes_played'] is not None and cb['minutes_played'] > 0; assert isinstance(cb['per90_metrics'], dict) and cb['per90_metrics']['events'] > 0; assert cb['data_quality']['status'] == 'complete' and cb['data_quality']['reasons'] == []; assert cb['data_consistency']['status'] == 'consistent' and cb['data_consistency']['reasons'] == []; assert 'rating' not in cb; print('MESSI_MINUTES=' + str(m['minutes_played'])); print('ROMERO_CB_SAMPLE=' + json.dumps({'player': cb['player_name'], 'matches': cb['matches_with_appearance_evidence'], 'positions': cb['positions_seen'], 'metrics': cb['metrics'], 'minutes_played': cb['minutes_played'], 'per90_metrics': cb['per90_metrics'], 'interpretation': 'raw totals across three matches; not a rating'}, sort_keys=True)); print('Real StatsBomb 3-match CB event profile and minutes smoke test passed; verified per-90 metrics checked; report remained on the ephemeral runner.')"
