name: StatsBomb import prototype tests

on:
  push:
    branches: [main, feature/verified-minutes-calculation, feature/metric-interpretation-guidance, feature/match-context-metadata, feature/event-time-score-timeline, feature/player-metrics-by-score-state, feature/score-state-duration-context, feature/player-score-state-minutes, feature/score-state-per90-metrics]
    paths:
      - "vision/statsbomb_open_data/**"
      - "vision/afriskaut_open_data/**"
      - ".github/workflows/statsbomb-import-tests.yml"
  pull_request:
    paths:
      - "vision/statsbomb_open_data/**"
      - "vision/afriskaut_open_data/**"
      - ".github/workflows/statsbomb-import-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  statsbomb-import-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile importer and report renderer
        run: python -m py_compile vision/statsbomb_open_data/import_open_data.py vision/statsbomb_open_data/render_player_report.py
      - name: Run unit tests
        run: python -m unittest discover -s vision/statsbomb_open_data -p "test_*.py" -v

  statsbomb-live-data-smoke:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/feature/verified-minutes-calculation' || github.ref == 'refs/heads/feature/metric-interpretation-guidance' || github.ref == 'refs/heads/feature/match-context-metadata' || github.ref == 'refs/heads/feature/event-time-score-timeline' || github.ref == 'refs/heads/feature/player-metrics-by-score-state' || github.ref == 'refs/heads/feature/score-state-duration-context' || github.ref == 'refs/heads/feature/player-score-state-minutes' || github.ref == 'refs/heads/feature/score-state-per90-metrics'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Import three public matches without publishing the report
        run: |
          python vision/statsbomb_open_data/import_open_data.py \
            --competition-id 43 --season-id 106 \
            --match-id 3869519 --match-id 3869685 --match-id 3869151 \
            --data-root .cache/statsbomb-open-data/smoke/raw \
            --report .cache/statsbomb-open-data/smoke/import-report.json > /dev/null
          python -c "import json; p=json.load(open('.cache/statsbomb-open-data/smoke/import-report.json', encoding='utf-8')); assert p['sample']['selected_match_count'] == 3; assert p['sample']['event_count'] > 0; assert all(m['match']['match_context']['score_state_timeline']['status'] == 'validated' for m in p['matches']); assert all(m['match']['match_context']['score_state_timeline']['score_reconciled'] for m in p['matches']); assert all(m['match']['match_context']['score_state_timeline']['durations']['status'] == 'validated' for m in p['matches']); assert all(player['score_state_analysis']['minutes_status'] == 'validated' for match in p['matches'] for player in match['player_metrics'] if player['minutes_played_seconds'] is not None); assert all(sum(player['score_state_analysis']['minutes_by_state_seconds'].values()) == player['minutes_played_seconds'] for match in p['matches'] for player in match['player_metrics'] if player['minutes_played_seconds'] is not None); assert all(sum(m['match']['match_context']['score_state_timeline']['durations']['home_team_seconds_by_state'].values()) == m['match']['match_context']['score_state_timeline']['durations']['total_seconds'] == sum(m['match']['match_context']['score_state_timeline']['durations']['away_team_seconds_by_state'].values()) for m in p['matches']); assert all(all(m['score_state_analysis']['classified_player_events'] + m['score_state_analysis']['unclassified_player_events'] == m['metrics']['events'] for m in match['player_metrics']) for match in p['matches']); assert all(all(sum(m['score_state_analysis']['metrics_by_state'][state]['events'] for state in ('leading','drawing','trailing')) == m['score_state_analysis']['classified_player_events'] for m in match['player_metrics'] if isinstance(m['score_state_analysis']['metrics_by_state'], dict)) for match in p['matches']); assert all(player['score_state_analysis']['per90_status'] == 'validated' for match in p['matches'] for player in match['player_metrics'] if player['score_state_analysis']['status'] == 'validated' and player['score_state_analysis']['minutes_status'] == 'validated'); assert all(all((player['score_state_analysis']['per90_metrics_by_state'][state] is None) if player['score_state_analysis']['minutes_by_state_seconds'][state] == 0 else isinstance(player['score_state_analysis']['per90_metrics_by_state'][state], dict) for state in ('leading','drawing','trailing')) for match in p['matches'] for player in match['player_metrics'] if player['score_state_analysis']['per90_status'] == 'validated'); assert any(player['score_state_analysis']['per90_status'] == 'validated' for player in p['player_sample_totals']); assert all(player['data_consistency']['checks']['score_state_minutes_status_counts_match'] is True and player['data_consistency']['checks']['score_state_minutes_totals_match'] is True and player['data_consistency']['checks']['score_state_per90_recalculated'] is True for player in p['player_sample_totals'] if player['score_state_analysis']['per90_status'] == 'validated'); assert all(player['data_consistency']['checks']['score_state_metric_totals_match'] is True for player in p['player_sample_totals']); assert all('match_context' in m['match'] for m in p['matches']); assert all(m['match']['match_context']['scoreline_status'] == 'complete' for m in p['matches']); assert all(m['match']['match_context']['source_field_availability']['scoreline'] for m in p['matches']); assert len(p['player_sample_totals']) > 0; assert all(m['quality']['minutes_calculation']['status'] == 'valid' for m in p['matches']), [m['quality']['minutes_calculation'] for m in p['matches']]; m=next(x for x in p['player_sample_totals'] if str(x['player_id']) == '5503'); assert m['matches_with_appearance_evidence'] == 3; assert m['minutes_calculation_complete'] is True and m['minutes_played'] is not None and m['minutes_played'] > 0; assert isinstance(m['per90_metrics'], dict) and m['per90_metrics']['events'] > 0 and m['per90_metrics']['passes_attempted'] > 0; w=p['role_profiles']['W']; assert w['role_code'] == 'W' and w['player_count'] == len(w['players']); assert all(isinstance(row['grouped_metrics'], dict) for row in w['players']); st=p['role_profiles']['ST']; assert st['role_code'] == 'ST' and st['player_count'] == len(st['players']); assert all(isinstance(row['grouped_metrics'], dict) for row in st['players']); gk=p['role_profiles']['GK']; assert gk['role_code'] == 'GK' and gk['player_count'] > 0 and gk['player_count'] == len(gk['players']); assert all(isinstance(row['grouped_metrics'], dict) for row in gk['players']); assert any(row['metrics']['goalkeeper_actions'] > 0 for row in gk['players']); rb=p['role_benchmarks']; assert rb['benchmark_version'] == 'peer-percentiles-v1'; assert rb['comparison_scope'] == 'same competition and season report; same role profile'; assert set(rb['roles']) == {'CB','FB','CM','W','ST','GK'}; assert all(role['minimum_cohort_size'] == 10 and role['minimum_verified_minutes'] == 450.0 for role in rb['roles'].values()); assert all(player['metrics'] for role in rb['roles'].values() for player in role['players']); guidance=rb['metric_guidance']; expected_guidance={metric for role in rb['roles'].values() for metric in role['metric_summaries']}; assert set(guidance) == expected_guidance; assert all(set(item) == {'display_name','unit','directionality','what_it_measures','interpretation_note','does_not_measure'} for item in guidance.values()); assert all(item['directionality'] in {'context_dependent','adverse_outcome_context_dependent'} for item in guidance.values()); assert guidance['goalkeeper_goals_conceded']['directionality'] == 'adverse_outcome_context_dependent'; assert all('distribution' in metric for role in rb['roles'].values() for metric in role['metric_summaries'].values()); assert all((metric['distribution'] is None) if metric['status'] == 'insufficient_sample' else set(metric['distribution']) == {'minimum','p25','median','p75','maximum','quartile_method'} for role in rb['roles'].values() for metric in role['metric_summaries'].values()); assert all(set(metric) >= {'difference_from_median_per90','within_cohort_middle_50_percent'} for role in rb['roles'].values() for player in role['players'] for metric in player['metrics'].values()); rd=p['player_evaluation_readiness']; assert rd['readiness_version'] == 'scout-review-readiness-v1'; assert rd['minimum_verified_minutes'] == 450.0 and rd['minimum_appearances'] == 5; assert set(rd['roles']) == {'CB','FB','CM','W','ST','GK'}; assert all(row['readiness_status'] in {'ready_for_scout_review','limited','insufficient_data'} for role in rd['roles'].values() for row in role['players']); cm=p['role_profiles']['CM']; assert cm['role_code'] == 'CM' and cm['player_count'] == len(cm['players']); assert all(isinstance(row['grouped_metrics'], dict) for row in cm['players']); cb=next(x for x in p['role_profiles']['CB']['players'] if str(x['player_id']) == '20572'); assert cb['matches_with_appearance_evidence'] == 3; assert any('Center Back' in role for role in cb['positions_seen']); assert cb['metrics']['events'] > 0; assert cb['metrics']['passes_attempted'] > 0; assert cb['minutes_played'] is not None and cb['minutes_played'] > 0; assert isinstance(cb['per90_metrics'], dict) and cb['per90_metrics']['events'] > 0; assert cb['data_quality']['status'] == 'complete' and cb['data_quality']['reasons'] == []; assert cb['data_consistency']['status'] == 'consistent' and cb['data_consistency']['reasons'] == []; assert cb['identity']['key'] == 'statsbomb:20572' and cb['identity']['checks']['player_id_matches']; assert cb['identity']['possible_same_name_collision'] is False; assert p['sample']['possible_same_name_collision_groups'] == len(p['player_identity_review']['same_name_different_ids']); assert 'rating' not in cb; print('MESSI_MINUTES=' + str(m['minutes_played'])); print('ROMERO_CB_SAMPLE=' + json.dumps({'player': cb['player_name'], 'matches': cb['matches_with_appearance_evidence'], 'positions': cb['positions_seen'], 'metrics': cb['metrics'], 'minutes_played': cb['minutes_played'], 'per90_metrics': cb['per90_metrics'], 'interpretation': 'raw totals across three matches; not a rating'}, sort_keys=True)); print('Real StatsBomb 3-match CB event profile and minutes smoke test passed; verified per-90 metrics checked; report remained on the ephemeral runner.')"
          python vision/statsbomb_open_data/import_open_data.py \
            --competition-id 43 --season-id 3 --match-id 8658 \
            --data-root .cache/statsbomb-open-data/own-goal-smoke/raw \
            --report .cache/statsbomb-open-data/own-goal-smoke/import-report.json > /dev/null
          python -c "import json; p=json.load(open('.cache/statsbomb-open-data/own-goal-smoke/import-report.json', encoding='utf-8')); m=p['matches'][0]; t=m['match']['match_context']['score_state_timeline']; assert t['status'] == 'validated', t; assert t['listed_score'] == {'home': 4, 'away': 2}; assert t['reconstructed_score'] == {'home': 4, 'away': 2}; assert t['durations']['status'] == 'validated'; assert sum(t['durations']['home_team_seconds_by_state'].values()) == t['durations']['total_seconds'] == sum(t['durations']['away_team_seconds_by_state'].values()); assert len([g for g in t['goals'] if g['goal_type'] == 'own_goal_for']) == 1; assert len(t['goals']) == 6; print('2018 France-Croatia final own-goal score timeline smoke test passed.')"
      - name: Render player reports from the real-data sample
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          report_path = Path(".cache/statsbomb-open-data/smoke/import-report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          rendered = 0
          for role in ("CB", "FB", "CM", "W", "ST", "GK"):
              profile = report["role_profiles"][role]
              players = profile.get("players") or []
              if not players:
                  continue
              player = players[0]
              output = Path(".cache/statsbomb-open-data/smoke") / f"player-{role}-{player['player_id']}.md"
              subprocess.run([
                  sys.executable,
                  "vision/statsbomb_open_data/render_player_report.py",
                  str(report_path),
                  "--player-id", str(player["player_id"]),
                  "--role", role,
                  "--output", str(output),
              ], check=True)
              content = output.read_text(encoding="utf-8")
              assert "Source provenance" in content
              assert "What this report does not claim" in content
              assert "not a player rating" in content.lower()
              rendered += 1
          assert rendered > 0, "No role profile contained a player to render."
          print(f"Rendered and validated {rendered} role-specific report(s) from the real three-match sample.")
          PY
  afriskaut-youth-data-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test Afriskaut position normalizer and match linkage
        run: python -m unittest discover -s vision/afriskaut_open_data -p "test_*.py" -v
      - name: Inspect public Afriskaut youth event dataset
        run: python vision/afriskaut_open_data/probe_dataset.py
      - name: Describe match timing, period and substitution structure (aggregate only)
        run: python vision/afriskaut_open_data/diagnose_match_timing.py
      - name: Check match clocks and substitution events for verified minutes (aggregate only)
        run: python vision/afriskaut_open_data/diagnose_minutes_feasibility.py
      - name: Validate conservative player minutes on real data (aggregate only)
        run: python vision/afriskaut_open_data/validate_player_minutes.py
      - name: Diagnose unmatched actors against substitution metadata
        run: python vision/afriskaut_open_data/diagnose_substitution_metadata.py
      - name: Classify residual event actor links
        run: python vision/afriskaut_open_data/diagnose_residual_actor_links.py
      - name: Audit event eligibility for player metrics
        run: python vision/afriskaut_open_data/audit_player_metric_eligibility.py
      - name: Build center-back raw metric profile
        run: python vision/afriskaut_open_data/center_back_metrics.py
