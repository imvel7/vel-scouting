name: StatsBomb import prototype tests

on:
  push:
    branches: [main]
    paths:
      - "vision/statsbomb_open_data/**"
      - "vision/afriskaut_open_data/**"
      - ".github/workflows/statsbomb-import-tests.yml"
  pull_request:
    paths:
      - "vision/statsbomb_open_data/**"
      - "vision/afriskaut_open_data/**"
      - ".github/workflows/statsbomb-import-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  statsbomb-import-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile importer
        run: python -m py_compile vision/statsbomb_open_data/import_open_data.py
      - name: Run unit tests
        run: python -m unittest discover -s vision/statsbomb_open_data -p "test_*.py" -v

  statsbomb-live-data-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Import three public matches without publishing the report
        run: |
          python vision/statsbomb_open_data/import_open_data.py \
            --competition-id 43 --season-id 106 \
            --match-id 3869519 --match-id 3869685 --match-id 3869151 \
            --data-root .cache/statsbomb-open-data/smoke/raw \
            --report .cache/statsbomb-open-data/smoke/import-report.json > /dev/null
          python -c "import json; p=json.load(open('.cache/statsbomb-open-data/smoke/import-report.json', encoding='utf-8')); assert p['sample']['selected_match_count'] == 3; assert p['sample']['event_count'] > 0; assert len(p['player_sample_totals']) > 0; m=next(x for x in p['player_sample_totals'] if str(x['player_id']) == '5503'); assert m['matches_with_appearance_evidence'] == 3; cb=next(x for x in p['role_profiles']['CB']['players'] if str(x['player_id']) == '20572'); assert cb['matches_with_appearance_evidence'] == 3; assert any('Center Back' in role for role in cb['positions_seen']); assert cb['metrics']['events'] > 0; assert cb['metrics']['passes_attempted'] > 0; assert 'rating' not in cb; print('ROMERO_CB_SAMPLE=' + json.dumps({'player': cb['player_name'], 'matches': cb['matches_with_appearance_evidence'], 'positions': cb['positions_seen'], 'metrics': cb['metrics'], 'minutes_played': cb['minutes_played'], 'interpretation': 'raw totals across three matches; not a rating'}, sort_keys=True)); print('Real StatsBomb 3-match CB event profile smoke test passed; report remained on the ephemeral runner.')"

  afriskaut-youth-data-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test Afriskaut position normalizer and match linkage
        run: python -m unittest discover -s vision/afriskaut_open_data -p "test_*.py" -v
      - name: Inspect public Afriskaut youth event dataset
        run: python vision/afriskaut_open_data/probe_dataset.py
      - name: Diagnose unmatched actors against substitution metadata
        run: python vision/afriskaut_open_data/diagnose_substitution_metadata.py
      - name: Classify residual event actor links
        run: python vision/afriskaut_open_data/diagnose_residual_actor_links.py
