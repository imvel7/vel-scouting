name: DB baseline and guard tests

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/replay_baseline.sh'
      - '.github/workflows/db-baseline-tests.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/replay_baseline.sh'

permissions:
  contents: read

jobs:
  db-baseline-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Replay baseline and run rolled-back tests
        run: ./scripts/replay_baseline.sh
